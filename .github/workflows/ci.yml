name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (saves CI minutes on rapid pushes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # The file lock is the one platform-specific thing in the store
          # (fcntl on POSIX, msvcrt on Windows). Claiming Windows works without
          # running it there is how it broke the first time.
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure git
        # The git-integration tests create throwaway repos and assume the
        # initial branch is `main`. CI runners default to `master`, so pin it
        # (and set an identity for the commits those tests make).
        shell: bash
        run: |
          git config --global init.defaultBranch main
          git config --global user.email "ci@arctx.dev"
          git config --global user.name "ARCTX CI"
      - name: Install test dependencies
        # Packages run from source via PYTHONPATH, mirroring the documented
        # dev workflow. We only need the runtime dep (typing-extensions) plus
        # the test runner.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "typing-extensions>=4.0.0" \
            "pytest>=7.0"
      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        # PYTHONPATH is built in Python so the separator is right on both
        # runners (":" on POSIX, ";" on Windows).
        run: python .github/run_tests.py

  web:
    name: web (typecheck & layout tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Run tests
        # The layout has no visible failure mode -- a wrong position is still a
        # position -- so its invariants are pinned in src/layout.test.ts.
        working-directory: web
        run: npm test

  build:
    name: build & twine check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install --upgrade pip build twine
      - name: Bundle the frontend assets
        env:
          PYTHONPATH: packages/arctx/src
        run: python -m arctx.web.bundle
      - name: Build all packages
        run: |
          for pkg in arctx arctx-cli; do
            python -m build "packages/$pkg"
          done
      - name: twine check
        run: python -m twine check packages/*/dist/*

  lint:
    name: lint (informational)
    runs-on: ubuntu-latest
    # Non-blocking for now: the codebase predates ruff/black enforcement, so
    # these steps report findings without failing CI. To enforce later, run
    # `ruff check --fix .` and `black .` to clean the tree, then remove the
    # per-step `continue-on-error`.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip "ruff>=0.1.0" "black>=23.0"
      - name: ruff check
        continue-on-error: true
        run: ruff check .
      - name: black --check
        continue-on-error: true
        run: black --check .
